name: v1 Integration tests

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: 'Restore and save the pytest lastfailed cache.'
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      use-cache:
        description: 'Restore and save the pytest lastfailed cache. The release passes false.'
        type: boolean
        required: false
        default: true
    secrets:
      FIREBOLT_STG_USERNAME:
        required: true
      FIREBOLT_STG_PASSWORD:
        required: true

permissions: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Setup database and engine
        id: setup
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-username: ${{ secrets.FIREBOLT_STG_USERNAME }}
          firebolt-password: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          api-endpoint: "api.staging.firebolt.io"
          region: "us-east-1"

      - name: Restore cached failed tests
        id: cache-tests-restore
        if: inputs.use-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ runner.os }}-pytest-restore-failed-${{ github.ref }}-${{ github.sha }}-v1

      - name: Run integration tests
        env:
          # the distinction is on the SDK side so just use CLIENT_* for username password
          CLIENT_ID: ${{ secrets.FIREBOLT_STG_USERNAME }}
          CLIENT_SECRET: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          DATABASE_NAME: ${{ steps.setup.outputs.database_name }}
          ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
          ENGINE_URL: ${{ steps.setup.outputs.engine_url }}
          STOPPED_ENGINE_NAME: ${{ steps.setup.outputs.stopped_engine_name }}
          STOPPED_ENGINE_URL: ${{ steps.setup.outputs.stopped_engine_url }}
          FIREBOLT_BASE_URL: "api.staging.firebolt.io"
          ACCOUNT_NAME: "firebolt"
        run: |
          pytest --last-failed -o log_cli=true -o log_cli_level=INFO tests/integration -k "not core"

      - name: Save failed tests
        id: cache-tests-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && inputs.use-cache
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ steps.cache-tests-restore.outputs.cache-primary-key }}
