name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
        default: 'preview-rc'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
        default: 'preview-rc'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'

permissions: {}

jobs:
  run-core-integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Allure report is pushed to gh-pages
      statuses: write # the Allure report sets a commit status
      pages: read     # the Allure report reads the Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Firebolt Core
        id: setup-core
        uses: firebolt-db/action-setup-core@59cccf73984932ef816a4d4984a3c39dde151ca7 # main
        with:
          tag_version: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run Core integration tests
        env:
          CORE_URL: ${{ steps.setup-core.outputs.service_url }}
        run: |
          pytest -o log_cli=true -o log_cli_level=INFO tests/integration -k "core" --alluredir=allure-results

      # Need to pull the pages branch in order to fetch the previous runs
      - name: Get Allure history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages
            persist-credentials: false

      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        if: always()
        with:
            github-key: ${{ secrets.GITHUB_TOKEN }}
            test-type: integration
            allure-dir: allure-results
            pages-branch: gh-pages
            repository-name: firebolt-sqlalchemy
