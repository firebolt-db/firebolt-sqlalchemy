name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
        default: 'preview-rc'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
        default: 'preview-rc'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'

permissions: {}

jobs:
  run-core-integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Allure report is pushed to gh-pages
      statuses: write # the Allure report sets a commit status
      pages: read     # the Allure report reads the Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Firebolt Core
        id: setup-core
        uses: firebolt-db/action-setup-core@5adec87419b62523e77ca1a1affe9411809738a5 # v1.1.0
        with:
          tag_version: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run Core integration tests
        env:
          CORE_URL: ${{ steps.setup-core.outputs.service_url }}
        run: |
          pytest -o log_cli=true -o log_cli_level=INFO tests/integration -k "core" --alluredir=allure-results

      # action-allure-report v2 checks out the pages branch for the history itself.
      - name: Allure Report
        uses: firebolt-db/action-allure-report@39037f1a56d995af294067c7c5ceb5713c407274 # v2.1.2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "core"
            }
