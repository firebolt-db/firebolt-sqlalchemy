name: v2 Integration tests

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: 'Restore and save the pytest lastfailed cache.'
        type: boolean
        required: false
        default: true
  workflow_call:
    secrets:
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: true
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: true
      AWS_ACCESS_ROLE_ARN:
        required: true
      TOKEN:
        description: 'GitHub token for the Allure report if called from another workflow. Defaults to GITHUB_TOKEN.'
        required: false
    inputs:
      engine-version:
        description: 'Engine version to use for integration tests'
        required: false
        type: string
        default: ''
      use-cache:
        description: 'Restore and save the pytest lastfailed cache. The release passes false.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Allure report is pushed to gh-pages
      statuses: write # the Allure report sets a commit status
      pages: read     # the Allure report reads the Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firebolt-db/firebolt-sqlalchemy
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Setup database and engine
        id: setup
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-client-id: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          firebolt-client-secret: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          account: ${{ vars.FIREBOLT_ACCOUNT }}
          api-endpoint: "api.staging.firebolt.io"

      - name: Restore cached failed tests
        id: cache-tests-restore
        if: inputs.use-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ runner.os }}-pytest-restore-failed-${{ github.ref }}-${{ github.sha }}-v2

      - name: Run integration tests
        env:
          CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          AWS_ACCESS_ROLE_ARN: ${{ secrets.AWS_ACCESS_ROLE_ARN }}
          DATABASE_NAME: ${{ steps.setup.outputs.database_name }}
          ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
          STOPPED_ENGINE_NAME: ${{ steps.setup.outputs.stopped_engine_name }}
          FIREBOLT_BASE_URL: "api.staging.firebolt.io"
          ACCOUNT_NAME: ${{ vars.FIREBOLT_ACCOUNT }}
        run: |
          pytest --last-failed -o log_cli=true -o log_cli_level=INFO tests/integration -k "not core" --alluredir=allure-results

      - name: Save failed tests
        id: cache-tests-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && inputs.use-cache
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ steps.cache-tests-restore.outputs.cache-primary-key }}

      # action-allure-report v2 checks out the pages branch for the history itself.
      - name: Allure Report
        uses: firebolt-db/action-allure-report@39037f1a56d995af294067c7c5ceb5713c407274 # v2.1.2
        if: always()
        with:
          github-token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "integration"
            }
